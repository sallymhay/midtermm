<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe Script', 'Brush Script MT', 'Comic Sans MS', cursive;
    background: #1a0b1f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
  }
  .box {
    max-width: 420px;
    width: 100%;
    background: #2a1233;
    border-radius: 1.8rem;
    box-shadow: 0 18px 40px rgba(60, 0, 90, .5);
    padding: 2.5rem 2rem;
    border: 2px solid #5c2d6e;
    text-align: center;
  }
  .title {
    color: #e8c9f0;
    border-bottom: 2px dashed #8a4fa8;
    padding-bottom: .7rem;
    margin-bottom: 1.8rem;
    font-size: 1.8rem;
    letter-spacing: 1px;
  }
  p { color: #d8b5e8; margin-bottom: .5rem; font-size: .95rem; }
  a.btn {
    display: block;
    width: 100%;
    padding: .8rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 2rem;
    text-decoration: none;
    margin-top: 1rem;
    font-family: inherit;
    transition: .2s;
  }
  .go-login { background: #7a3d99; color: #fff; }
  .go-login:hover { background: #964fc0; }
  .go-register { background: transparent; color: #dcb5ea; border: 2px solid #b06fcf; }
  .go-register:hover { background: #3d1a4d; }
</style>
</head>
<body>
<div class="box">
  <h1 class="title">Welcome</h1>
  <p>Please choose an option</p>
  <a href="login.html" class="btn go-login">Login</a>
  <a href="register.html" class="btn go-register">Register</a>
</div>
</body>
</html>
